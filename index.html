<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catena Founder Chain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE everyday work tool with a game loop: direct, calm under pressure, playful about progress
   IDEA a forged chain: people are big links, shared contexts (departments) are the small links between them
   PICTURE the live chain itself, every small link coloured by status and tappable
   COLOUR white ground, ink, cobalt links and bands, signal red for crisis, yellow for opportunity
   TYPE Archivo 800 display + Archivo text
   LAYOUT cobalt top bar; title + stats; full-width chain; desk | log+badges; action board; people; ventures; cobalt brand band. Phone: stacked, chain turns vertical */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0f1220);--ink:light-dark(#0d0f1a,#eef0f7);--mut:light-dark(#555c74,#a6acc2);--line:light-dark(#dfe3ee,#2b3049);--pan:light-dark(#f2f4fb,#171b2e);--br:light-dark(#1f4bff,#7591ff);--hdr:light-dark(#1f4bff,#16246e);--cr:light-dark(#dc3328,#ff6c61);--op:light-dark(#f2b400,#ffcd38)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Archivo,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip}
.band{padding-block:clamp(24px,3.5vw,48px);padding-left:max(5vw,16px);padding-right:max(5vw,16px)}
.alt{background:var(--pan)}
.wrap{max-width:1240px;margin:0 auto}
.hdr{background:var(--hdr);color:#fff;padding:12px max(5vw,16px)}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:24px;letter-spacing:-.02em}
.logo small{font-weight:500;font-size:14px;opacity:.85;letter-spacing:0}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sync{font-size:13px;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.16);white-space:nowrap}
.sync i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:#ffcd38;vertical-align:1px}
.sync.live i{background:#5df2a0}
.sync.err i{background:#ff8a80}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
h1{font-size:clamp(30px,4.4vw,48px);line-height:1.05;letter-spacing:-.02em;margin:0 0 8px;text-wrap:balance;font-weight:800}
h2{font-size:22px;line-height:1.15;margin:0 0 8px;letter-spacing:-.01em;font-weight:800}
h3{font-size:18px;line-height:1.25;margin:10px 0 4px}
.sub{color:var(--mut);max-width:66ch;margin:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5em,1fr));gap:10px;margin-top:18px}
.stat{background:var(--pan);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.stat b{display:block;font-size:clamp(22px,3vw,28px);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat span{font-size:13px;color:var(--mut)}
.stat em{display:block;font-style:normal;font-size:13px;color:var(--mut);white-space:nowrap}
.meter{height:6px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--br);border-radius:3px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:18px 0 10px}
button,select,input,textarea{font:inherit;font-size:16px;color:var(--ink)}
button,.btn{font-weight:600;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
button:hover,.btn:hover{border-color:var(--br)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible,.btn:focus-within{outline:3px solid var(--br);outline-offset:2px}
.pri{background:var(--br);color:#fff;border-color:var(--br)}
.hdr select,.hdr button{min-height:40px;border-color:transparent;background:#fff;color:#0d0f1a;border-radius:10px;padding:0 12px}
select,input{min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
textarea{width:100%;min-height:92px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);resize:vertical;line-height:1.45}
.chainbox{border:1px solid var(--line);border-radius:16px;background:var(--pan);overflow-x:auto;overflow-y:hidden}
#chain{display:block}
#chain text{paint-order:stroke;stroke:var(--pan);stroke-width:4px;fill:var(--ink);font-family:Archivo,system-ui,sans-serif}
#chain .m{fill:var(--mut)}
#chain [data-k],#chain [data-m]{cursor:pointer;outline:none}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-top:10px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.note{font-size:13px;color:var(--mut);margin:8px 0 0}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:18px}
.tag{display:inline-flex;align-items:center;min-height:30px;font-size:13px;font-weight:600;padding:0 10px;border-radius:99px;background:var(--pan);border:1px solid var(--line);white-space:nowrap}
.tag.c{background:var(--cr);color:#fff;border-color:var(--cr)}
.tag.o{background:var(--op);color:#1d1600;border-color:var(--op)}
.tag.ai{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{text-align:left;justify-content:flex-start;padding:12px 14px;min-height:54px;line-height:1.35;font-weight:500}
.opt.best{border-color:var(--br);background:color-mix(in srgb,var(--br) 13%,var(--bg))}
.opt.bad{border-color:var(--cr);background:color-mix(in srgb,var(--cr) 11%,var(--bg))}
.opt.pick{outline:2px solid var(--ink);outline-offset:1px}
.timer{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:12px}
.timer i{display:block;height:100%;background:var(--cr);transition:width .25s linear}
.tl{font-size:13px;color:var(--mut);margin:4px 0 0;font-variant-numeric:tabular-nums}
.warn{font-size:14px;color:var(--cr);font-weight:600;margin:10px 0 0}
.lesson{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--pan)}
.verdict{font-weight:800;font-size:18px;margin-top:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.pb{margin:12px 0 0;padding-left:1.3em}
.pb li{margin:2px 0}
.ai{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.ai label{font-weight:800;display:block;margin-bottom:6px}
.feed{list-style:none;margin:0;padding:0;max-height:320px;overflow:auto}
.feed li{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.feed time{color:var(--mut);margin-right:8px;font-variant-numeric:tabular-nums}
.feed .by{color:var(--mut)}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{font-size:13px;padding:6px 12px;border-radius:99px;border:1px dashed var(--line);color:var(--mut)}
.badge.on{border-style:solid;border-color:var(--br);color:var(--ink);background:color-mix(in srgb,var(--br) 13%,var(--bg))}
.lb{display:grid;gap:8px;margin-bottom:4px}
.lbr{display:grid;grid-template-columns:minmax(0,7em) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px}
.lbr span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.lbr b{font-variant-numeric:tabular-nums;white-space:nowrap}
.hb{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.hb i{display:block;height:100%;background:var(--br);border-radius:5px}
.stat em.up{color:var(--br)}
.stat em.down{color:var(--cr)}
.drow{display:grid;grid-template-columns:minmax(0,7.5em) minmax(0,1fr) 2.5em;gap:10px;align-items:center;font-size:14px;margin:8px 0}
.drow b{text-align:right;font-variant-numeric:tabular-nums}
.retxt{white-space:pre-wrap;margin:10px 0 0;line-height:1.55}
.asw{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--mut)}
.hdot{width:14px;height:14px;border-radius:50%;display:inline-block}
.ht{width:100%;min-width:760px;border-collapse:collapse;font-size:14px;margin-top:14px;background:var(--bg);border-radius:12px;overflow:hidden}
.ht th,.ht td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.ht th{font-weight:600;color:var(--mut);font-size:13px;white-space:normal}
.ht th:first-child,.ht td:first-child{text-align:left}
.ht td:first-child button{min-height:36px;padding:0 10px;font-size:14px}
.ht tr.tot td{font-weight:800;border-bottom:0}
.ht .bad{color:var(--cr);font-weight:700}
.task .tag{min-width:5.5em;justify-content:center}
.linked{display:block;font-size:13px;color:var(--mut);margin-top:8px}
.hdr{position:relative;z-index:25}
@media(min-width:761px){.hdr{position:sticky;top:0}}
html{scroll-padding-top:76px}
#megaBtn{display:inline-flex;gap:8px}
#megaBtn svg{width:18px;height:18px}
.mega{position:absolute;left:0;right:0;top:100%;background:var(--bg);color:var(--ink);border-bottom:1px solid var(--line);box-shadow:0 18px 40px rgba(0,0,0,.18);padding:20px max(5vw,16px) 24px}
.mgrid{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.mgrid h3{font-size:14px;color:var(--mut);margin:0 0 6px;padding:0 12px}
.mgrid a{display:block;padding:10px 12px;border-radius:10px;color:var(--ink);text-decoration:none}
.mgrid a:hover,.mgrid a:focus-visible{background:var(--pan)}
.mgrid a b{display:block;font-size:15px}
.mgrid a span{display:block;font-size:13px;color:var(--mut);line-height:1.35}
.bbar{display:none}
.guide{counter-reset:g;list-style:none;margin:18px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.guide li{counter-increment:g;background:var(--pan);border:1px solid var(--line);border-radius:14px;padding:16px 16px 16px 60px;position:relative}
.guide li::before{content:counter(g);position:absolute;left:16px;top:14px;width:32px;height:32px;border-radius:50%;border:5px solid var(--br);display:grid;place-items:center;font-weight:800;font-size:13px}
.guide b{display:block;font-size:16px;margin-bottom:2px}
.guide span{color:var(--mut);font-size:15px}
.faq{margin-top:16px;display:grid;gap:8px;max-width:880px}
.faq details{background:var(--bg);border:1px solid var(--line);border-radius:12px}
.faq summary{cursor:pointer;font-weight:600;padding:14px 16px;min-height:44px;list-style-position:inside}
.faq summary:focus-visible{outline:3px solid var(--br);outline-offset:2px;border-radius:12px}
.faq p{margin:0;padding:0 16px 14px;color:var(--mut)}
.foot{background:light-dark(#0d0f1a,#080a12);color:#e8eaf3;padding:clamp(28px,4vw,48px) max(5vw,16px) 24px}
.fgrid{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.4fr) repeat(3,minmax(0,1fr));gap:28px}
.foot h3{font-size:14px;margin:0 0 10px;color:#a9aec4}
.foot ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.foot a{color:#fff;text-decoration:none;display:inline-flex;min-height:36px;align-items:center}
.foot a:hover{text-decoration:underline}
.foot p{margin:6px 0;color:#c9cde0;font-size:15px}
.fbrand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:24px;color:#fff}
.fbase{max-width:1240px;margin:28px auto 0;padding-top:16px;border-top:1px solid rgba(255,255,255,.14);font-size:13px;color:#a9aec4;display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between}
@media(max-width:900px){.fgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media(max-width:520px){.fgrid{grid-template-columns:minmax(0,1fr)}}
@media(max-width:760px){
#megaBtn{display:none}
.mega{position:fixed;top:auto;bottom:calc(62px + env(safe-area-inset-bottom,0px));max-height:72vh;overflow:auto;border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.25)}
.mgrid{grid-template-columns:minmax(0,1fr);gap:10px}
.bbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:26}
.bbar a,.bbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:62px;font-size:12px;font-weight:600;color:var(--mut);background:none;border:0;border-radius:0;padding:0;text-decoration:none}
.bbar svg{width:22px;height:22px}
.bbar [aria-current=true]{color:var(--br)}
body{padding-bottom:calc(62px + env(safe-area-inset-bottom,0px))}
.toast{bottom:calc(74px + env(safe-area-inset-bottom,0px))}
}
.welcome{margin:16px 0 4px;padding:16px 18px;border-radius:16px;background:color-mix(in srgb,var(--br) 10%,var(--bg));border:1px solid color-mix(in srgb,var(--br) 35%,var(--line))}
.welcome h2{font-size:19px;margin:0 0 6px}
.welcome ol{margin:0 0 4px;padding-left:1.3em}
.hint{font-size:14px;color:var(--mut);padding:14px 16px;margin:0}
.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(140%);background:var(--ink);color:var(--bg);padding:10px 12px 10px 18px;border-radius:12px;display:flex;align-items:center;gap:12px;font-weight:600;font-size:15px;box-shadow:0 6px 24px rgba(0,0,0,.25);transition:transform .25s ease;z-index:20;max-width:calc(100vw - 32px)}
.toast.on{transform:translateX(-50%) translateY(0)}
.toast button{min-height:36px;background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 40%,transparent)}
.toast button[hidden]{display:none}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
.tasks{display:grid;gap:8px;margin-top:14px}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.task input{width:22px;height:22px;min-height:0;padding:0;accent-color:var(--br)}
.task label{font-weight:600;cursor:pointer}
.task small{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--mut);font-size:13px}
.task.late small b{color:var(--cr)}
.task.done label{text-decoration:line-through;color:var(--mut);font-weight:500}
.task button{min-height:40px;width:40px;padding:0;font-size:20px}
.tf{display:grid;grid-template-columns:minmax(0,2.2fr) repeat(3,minmax(0,1fr)) auto;gap:8px;margin-top:14px}
.tf.hf{grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,2fr) auto}
@media(max-width:820px){.tf,.tf.hf{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.tf .wide{grid-column:1/-1}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;background:var(--bg);margin-top:14px}
.seg button{border:0;min-height:40px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.members{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:14px}
.mem{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--bg)}
.mem .row{margin-top:0;flex-wrap:nowrap}
.mem input{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{min-height:40px;padding:0 12px;font-size:14px;border-radius:99px;font-weight:500}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.port{display:flex;align-items:flex-start;overflow-x:auto;padding:14px 2px 6px;margin-top:8px}
.pn{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;width:92px}
.pr{width:72px;height:72px;border-radius:50%;border:10px solid var(--br);background:transparent;padding:0;font-weight:800;font-size:14px}
.pr.cur{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink)}
.pn span{font-size:13px;text-align:center;line-height:1.2;overflow-wrap:anywhere}
.pl{flex:none;width:30px;height:16px;border:6px solid var(--mut);border-radius:10px;margin:28px -14px 0;position:relative;z-index:1}
.hold{font-size:15px;margin-top:10px}
.vents{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:16px}
.vent{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px}
.vent.cur{border-color:var(--br);box-shadow:inset 0 0 0 1px var(--br)}
.vent b{font-size:18px}
.vent p{margin:2px 0 0;color:var(--mut);font-size:14px}
.vf{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.vf input{flex:1 1 200px}
.msg{font-size:14px;font-weight:600;margin:10px 0 0;min-height:1.5em}
body.none .needv{display:none}
.brandband{background:var(--hdr);color:#fff}
.bgrid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(20px,4vw,56px);align-items:start}
@media(max-width:760px){.bgrid{grid-template-columns:minmax(0,1fr)}}
.bname{font-size:clamp(52px,9vw,88px);line-height:1;font-weight:800;letter-spacing:-.04em;margin:10px 0 6px}
.bline{font-size:22px;font-weight:600;margin:6px 0 12px}
.brandband p{max-width:60ch}
.bdl{display:grid;grid-template-columns:9em minmax(0,1fr);gap:10px 16px;margin:0}
.bdl dt{font-weight:800}
.bdl dd{margin:0;opacity:.92}
@media(max-width:520px){.bdl{grid-template-columns:minmax(0,1fr)}.bdl dd{margin-bottom:6px}}
.sws{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:20px}
.sw{border-radius:12px;padding:12px;min-height:86px;display:flex;flex-direction:column;justify-content:flex-end;font-size:13px;border:1px solid rgba(255,255,255,.35)}
.sw b{font-size:14px}
footer{padding:20px max(5vw,16px);font-size:13px;color:var(--mut)}
@keyframes pulse{50%{opacity:.3}}
.pulse{animation:pulse 1.1s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.pulse{animation:none}.timer i{transition:none}}
</style>
</head>
<body>
<header class="hdr"><div class="wrap top">
  <div class="logo"><svg width="40" height="26" viewBox="0 0 40 26" aria-hidden="true"><circle cx="13" cy="13" r="9.5" fill="none" stroke="#fff" stroke-width="4"/><ellipse cx="29" cy="13" rx="8.5" ry="5.5" fill="none" stroke="#ffcd38" stroke-width="4"/></svg><span>catena</span><small id="tg"></small></div>
  <div class="tools"><span class="sync" id="sync"><i></i><span></span></span><button type="button" id="mine" data-act="mine" hidden></button><label class="vh" for="vsel">Venture</label><select id="vsel"></select><button id="lang" type="button" data-act="lang"></button><button id="megaBtn" type="button" data-act="mega" aria-expanded="false" aria-controls="mega"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg><span></span></button></div>
</div><div class="mega" id="mega" hidden></div></header>
<main>
<section class="band" id="s-chain"><div class="wrap">
  <h1 id="h1"></h1>
  <p class="sub" id="sub"></p>
  <div id="welcome"></div>
  <div class="stats needv" id="stats"></div>
  <div class="bar needv"><button class="pri" type="button" data-act="pulse" data-i="pulse"></button><button type="button" data-act="drill" data-i="drill"></button><span class="tag" id="mode"></span><label class="asw" for="asSel"><span data-i="as"></span><select id="asSel"></select></label></div>
  <div class="chainbox needv" id="chainbox"><svg id="chain" role="group" aria-label="chain"></svg></div>
  <div class="legend needv" id="legend"></div>
  <p class="note" data-i="sample"></p>
</div></section>

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));

const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const isoPlus=n=>{const d=new Date();d.setDate(d.getDate()+clamp(Math.round(+n||3),0,60));return ymd(d)};
const KEY='catena.v2',UIKEY='catena.ui';

const DEPTS={sales:{en:'Sales',tr:'Satış',hat:'CSO'},mkt:{en:'Marketing',tr:'Pazarlama',hat:'CMO'},fin:{en:'Finance',tr:'Finans',hat:'CFO'},it:{en:'IT',tr:'BT',hat:'CTO'},prod:{en:'Product',tr:'Ürün',hat:'CPO'},ops:{en:'Operations',tr:'Operasyon',hat:'COO'},ppl:{en:'People',tr:'İnsan',hat:'CHRO'},legal:{en:'Legal',tr:'Hukuk',hat:'CLO'}};
const DK=Object.keys(DEPTS);
const PB={
sales:{en:['Call the affected client within 24 hours','Write a dated recovery or close plan','Review revenue concentration every week'],tr:['Etkilenen müşteriyi 24 saat içinde ara','Tarihli bir kurtarma ya da kapanış planı yaz','Gelir yoğunlaşmasını her hafta gözden geçir']},
mkt:{en:['Reply in public within 2 hours','Publish a transparent update','Turn your advocates into ambassadors'],tr:['2 saat içinde herkese açık yanıt ver','Şeffaf bir güncelleme yayınla','Destekçilerini elçiye dönüştür']},
fin:{en:['Recalculate runway this week','Cut or defer non-core spend','Open a funding or prepayment conversation'],tr:['Nakit pistini bu hafta yeniden hesapla','Çekirdek dışı harcamayı kes ya da ertele','Finansman ya da peşin ödeme görüşmesi aç']},
it:{en:['Post a status update','Restore from the last good state','Write a blameless postmortem'],tr:['Durum güncellemesi yayınla','Son sağlam duruma geri dön','Suçlamasız bir olay sonrası rapor yaz']},
prod:{en:['Cut to the smallest valuable slice','Interview 5 affected users','Ship and measure within one sprint'],tr:['En küçük değerli parçaya indir','Etkilenen 5 kullanıcıyla görüş','Bir sprint içinde yayınla ve ölç']},
ops:{en:['Find 2 alternatives for the weak point','Automate one painful loop','Document the new process'],tr:['Zayıf nokta için 2 alternatif bul','Acı veren tek bir döngüyü otomatikleştir','Yeni süreci belgele']},
ppl:{en:['Hold a structured 1:1','Agree on one metric for the decision','Log the decision and review it in 2 weeks'],tr:['Yapılandırılmış bir birebir yap','Karar için tek bir metrikte anlaş','Kararı kaydet, 2 hafta sonra gözden geçir']},
legal:{en:['Log the request and its deadline','Check the data map or contract','Answer in writing before the deadline'],tr:['Başvuruyu ve süresini kaydet','Veri envanterini ya da sözleşmeyi kontrol et','Süre dolmadan yazılı yanıt ver']}
};

const SC=[
{d:'fin',t:'c',s:[3,-1,1],en:{h:'Runway just dropped to 3 months',b:'A big invoice slipped and burn stayed flat. The finance link is shaking.',o:['Cut non-core burn by 30% this week and open bridge-funding talks in parallel','Wait one more month for sales to catch up','Freeze all marketing spend and say nothing to the team'],l:'Treat 6 months as the alarm, not 3. Cut and fundraise at the same time, and tell the team the plan.'},tr:{h:'Nakit pisti 3 aya düştü',b:'Büyük bir fatura gecikti, harcama aynı kaldı. Finans halkası sallanıyor.',o:['Bu hafta çekirdek dışı harcamayı %30 kes, paralel olarak köprü finansman görüşmesi aç','Satışların yetişmesi için bir ay daha bekle','Tüm pazarlama harcamasını dondur, ekibe bir şey söyleme'],l:'Alarm 3 ayda değil 6 ayda çalmalı. Kesinti ve finansmanı aynı anda yürüt, planı ekiple paylaş.'}},
{d:'fin',t:'o',s:[3,1,-1],en:{h:'A client offers 12 months upfront for 15% off',b:'Cash now versus full price later.',o:['Accept, with a written scope lock and renewal terms','Decline to protect your price','Accept and add custom features for free'],l:'Prepaid cash buys runway. Protect it with a fixed scope, or the discount grows quietly.'},tr:{h:'Bir müşteri %15 indirimle 12 ay peşin ödemek istiyor',b:'Şimdi nakit mi, sonra tam fiyat mı?',o:['Kabul et; kapsamı ve yenileme şartlarını yazılı sabitle','Fiyatını korumak için reddet','Kabul et, üstüne ücretsiz özel geliştirme sun'],l:'Peşin nakit pisti uzatır. Kapsamı sabitlemezsen indirim sessizce büyür.'}},
{d:'sales',t:'c',s:[3,-1,1],en:{h:'Your biggest client (40% of revenue) threatens to leave',b:'They say support is slow and a competitor called them.',o:['Founder calls within 24h and agrees a dated 2-week recovery plan','Offer 50% off immediately to keep them','Ask the account manager to send a polite email'],l:'Revenue concentration is a chain risk. Show up in person, fix the cause, then reduce dependence on one client.'},tr:{h:'En büyük müşterin (gelirin %40\'ı) ayrılmakla tehdit ediyor',b:'Destek yavaş diyorlar ve bir rakip onları aramış.',o:['Kurucu 24 saat içinde arar, tarihli 2 haftalık kurtarma planında anlaşır','Hemen %50 indirim teklif et','Müşteri temsilcisinden kibar bir e-posta göndermesini iste'],l:'Tek müşteriye bağımlılık zincir riskidir. Bizzat ilgilen, sebebi çöz, sonra bağımlılığı azalt.'}},
{d:'sales',t:'o',s:[3,1,-1],en:{h:'An enterprise lead from abroad fills in your form',b:'Big logo, unfamiliar market, long sales cycles.',o:['Qualify in a 20-minute call, then propose a paid pilot','Send the full deck and price list right away','Ignore it: you are not ready for enterprise'],l:'Qualify before you invest. A paid pilot tests fit and pays for the learning.'},tr:{h:'Yurt dışından kurumsal bir aday form doldurdu',b:'Büyük logo, yabancı pazar, uzun satış döngüsü.',o:['20 dakikalık görüşmede nitele, ardından ücretli pilot öner','Tüm sunumu ve fiyat listesini hemen gönder','Yok say: kurumsala hazır değilsin'],l:'Yatırım yapmadan önce nitele. Ücretli pilot uyumu test eder ve öğrenmenin bedelini öder.'}},
{d:'mkt',t:'c',s:[3,-1,1],en:{h:'A negative post about you is going viral',b:'A user says your app lost their data. Comments are piling up.',o:['Reply publicly within 2 hours, fix it, post a transparent update','Delete the critical comments on your pages','Message the author privately and stay quiet in public'],l:'Speed and transparency beat silence. People judge how you respond, not only the original problem.'},tr:{h:'Hakkında olumsuz bir paylaşım viral oluyor',b:'Bir kullanıcı uygulamanın verisini kaybettiğini söylüyor. Yorumlar birikiyor.',o:['2 saat içinde açık yanıt ver, sorunu çöz, şeffaf güncelleme paylaş','Kendi sayfalarındaki eleştirel yorumları sil','Yazara özelden yaz, kamuoyunda sessiz kal'],l:'Hız ve şeffaflık sessizliği yener. İnsanlar yalnızca sorunu değil, nasıl yanıt verdiğini de görür.'}},
{d:'mkt',t:'o',s:[3,-1,1],en:{h:'A community member makes tutorials about your product',b:'Their videos bring sign-ups you never paid for.',o:['Feature them and start a small ambassador program with perks','Ask them to stop using your logo','Share one of their videos once'],l:'Community creators are a growth loop. Reward them and give them a status to climb.'},tr:{h:'Bir topluluk üyesi ürünün hakkında eğitim videoları çekiyor',b:'Videoları hiç para ödemediğin kayıtlar getiriyor.',o:['Onu öne çıkar, ayrıcalıklı küçük bir elçi programı başlat','Logonu kullanmayı bırakmasını iste','Videolarından birini bir kez paylaş'],l:'Topluluk üreticileri bir büyüme döngüsüdür. Ödüllendir ve tırmanabilecekleri bir statü ver.'}},
{d:'it',t:'c',s:[3,-1,1],en:{h:'Production database is down at peak hour',b:'Users cannot log in. The support inbox is filling up.',o:['Post a status page, roll back to the last good backup, write a postmortem','Hotfix directly on production without telling anyone','Wait for the hosting provider to reply'],l:'Communicate first, restore second, learn third. Untracked hotfixes cause the next outage.'},tr:{h:'Yoğun saatte canlı veritabanı çöktü',b:'Kullanıcılar giriş yapamıyor. Destek kutusu doluyor.',o:['Durum sayfası yayınla, son sağlam yedeğe dön, olay sonrası rapor yaz','Kimseye söylemeden canlıda doğrudan yama yap','Hosting firmasının yanıtını bekle'],l:'Önce iletişim, sonra geri yükleme, sonra öğrenme. Kayıtsız yamalar bir sonraki kesintiyi doğurur.'}},
{d:'it',t:'o',s:[3,-1,1],en:{h:'A cloud provider offers $10k in startup credits',b:'Free compute, but migration takes time.',o:['Apply, then move only non-critical workloads first','Migrate everything this week','Skip it, your current setup works'],l:'Credits are fuel, not a strategy. Migrate in small reversible steps and watch the bill when credits end.'},tr:{h:'Bir bulut sağlayıcı 10 bin dolar girişim kredisi sunuyor',b:'Ücretsiz işlem gücü, ama taşıma zaman alır.',o:['Başvur, önce yalnızca kritik olmayan iş yüklerini taşı','Bu hafta her şeyi taşı','Geç, mevcut kurulum çalışıyor'],l:'Kredi yakıttır, strateji değil. Küçük ve geri alınabilir adımlarla taşı, kredi bitince faturayı izle.'}},
{d:'prod',t:'c',s:[3,-1,1],en:{h:'The key launch is slipping by 3 weeks',b:'Marketing already announced the date.',o:['Cut to the smallest valuable slice and ship on the date','Ship everything on time, bugs included','Delay and announce a new date'],l:'Fix the date, flex the scope. A thin release that works keeps trust.'},tr:{h:'Ana lansman 3 hafta kayıyor',b:'Pazarlama tarihi çoktan duyurdu.',o:['En küçük değerli parçaya indir, tarihte yayınla','Hatalarıyla birlikte her şeyi zamanında yayınla','Ertele ve yeni tarih duyur'],l:'Tarihi sabitle, kapsamı esnet. Çalışan ince bir sürüm güveni korur.'}},
{d:'prod',t:'o',s:[3,-1,1],en:{h:'Users built a workaround for a missing feature',b:'Spreadsheets and screenshots are flying around your community.',o:['Interview 5 of them and ship the simplest version in one sprint','Design a full module with every option','Add it to the backlog'],l:'Workarounds are free market research. Ship the smallest thing that makes the workaround unnecessary.'},tr:{h:'Kullanıcılar eksik bir özellik için geçici çözüm üretmiş',b:'Toplulukta tablolar ve ekran görüntüleri dolaşıyor.',o:['5 kullanıcıyla görüş, en basit sürümü bir sprintte çıkar','Her seçeneği içeren tam bir modül tasarla','Bekleyen işler listesine ekle'],l:'Geçici çözümler bedava pazar araştırmasıdır. Onu gereksiz kılan en küçük şeyi yayınla.'}},
{d:'ops',t:'c',s:[3,-1,1],en:{h:'A key supplier doubled prices overnight',b:'Margins on your main product just vanished.',o:['Get 2 alternative quotes in 48h and renegotiate with data','Pass the full increase to customers today','Accept it to keep the relationship'],l:'Never keep a single point of failure in supply. Alternatives are negotiating power.'},tr:{h:'Ana tedarikçi bir gecede fiyatı ikiye katladı',b:'Ana ürünündeki kâr marjı yok oldu.',o:['48 saatte 2 alternatif teklif al, verilerle yeniden pazarlık yap','Artışın tamamını bugün müşteriye yansıt','İlişkiyi korumak için kabul et'],l:'Tedarikte tek hata noktası bırakma. Alternatifler pazarlık gücüdür.'}},
{d:'ops',t:'o',s:[3,-1,1],en:{h:'A weekly manual task could be automated',b:'Someone spends 6 hours a week copying orders between tools.',o:['Automate that one workflow and measure the hours saved','Automate every process at once','Hire an assistant to do it'],l:'Automate one painful loop, prove the saving, then repeat.'},tr:{h:'Haftalık manuel bir iş otomatikleştirilebilir',b:'Biri haftada 6 saat siparişleri araçlar arasında kopyalıyor.',o:['Sadece o iş akışını otomatikleştir, kazanılan saati ölç','Tüm süreçleri aynı anda otomatikleştir','Bunu yapacak bir asistan işe al'],l:'Acı veren tek bir döngüyü otomatikleştir, kazancı kanıtla, sonra tekrarla.'}},
{d:'ppl',t:'c',s:[3,-1,1],en:{h:'Two co-founders disagree on direction',b:'Meetings turn tense and decisions stall.',o:['Hold a structured 1:1, agree on one metric and log the decision','Avoid the topic until it cools down','Force a quick majority vote'],l:'Disagreement is fine; unresolved disagreement is not. Decide by an agreed metric and write it down.'},tr:{h:'İki kurucu ortak yön konusunda anlaşamıyor',b:'Toplantılar gerginleşiyor, kararlar tıkanıyor.',o:['Yapılandırılmış bir birebir yap, tek metrikte anlaş, kararı kayda geç','Konu soğuyana kadar açma','Hızlı bir çoğunluk oylamasıyla zorla'],l:'Fikir ayrılığı normaldir, çözülmeyeni değil. Ortak bir metrikle karar ver ve yaz.'}},
{d:'ppl',t:'o',s:[3,-1,1],en:{h:'A brilliant intern wants to join full-time',b:'Budget is tight, but they ship fast.',o:['Offer a scoped trial project with a clear salary and equity path','Hire immediately at a high salary','Say there is no budget'],l:'Make growth paths visible. A scoped trial protects both sides.'},tr:{h:'Parlak bir stajyer tam zamanlı katılmak istiyor',b:'Bütçe dar ama çok hızlı iş çıkarıyor.',o:['Net maaş ve hisse yolu olan kapsamlı bir deneme projesi sun','Hemen yüksek maaşla işe al','Bütçe olmadığını söyle'],l:'Gelişim yollarını görünür kıl. Kapsamlı bir deneme iki tarafı da korur.'}},
{d:'legal',t:'c',s:[3,-1,1],en:{h:'A user files a personal data request (KVKK/GDPR)',b:'There is a legal deadline and your data is spread across tools.',o:['Log it, verify identity, answer from your data map before the deadline','Ignore it, it is probably spam','Delete their whole account right away'],l:'Build a data map before you need it. Then every request is a routine task.'},tr:{h:'Bir kullanıcı kişisel veri başvurusu yaptı (KVKK/GDPR)',b:'Yasal bir süre var ve verilerin farklı araçlara dağılmış.',o:['Kayda al, kimliği doğrula, süre dolmadan veri envanterinden yanıtla','Yok say, muhtemelen spam','Hesabının tamamını hemen sil'],l:'Veri envanterini ihtiyaç doğmadan hazırla. Böylece her başvuru rutin bir iş olur.'}},
{d:'legal',t:'o',s:[3,-1,1],en:{h:'A partner proposes a co-branding deal',b:'Their audience is 10x yours.',o:['Sign a short MoU covering IP, revenue share and exit terms','Shake hands and start tomorrow','Wait months for lawyers to draft a full contract'],l:'Move fast with a short written agreement. IP and exit terms matter most.'},tr:{h:'Bir partner ortak markalaşma anlaşması öneriyor',b:'Kitleleri seninkinin 10 katı.',o:['Fikri mülkiyet, gelir paylaşımı ve çıkış şartlarını içeren kısa bir mutabakat imzala','El sıkış, yarın başla','Avukatların tam sözleşmesi için aylarca bekle'],l:'Kısa yazılı bir anlaşmayla hızlı ilerle. En önemlisi fikri mülkiyet ve çıkış şartları.'}}
];

async function flush(path){
  dirty.delete(path);
  if(writing.has(path)){again.add(path);return}
  const body=path==='holding/main'?S.h:path==='library/main'?S.lib:S.vs.find(x=>'ventures/'+x.id===path);if(!body)return;

  },()=>{clearTimeout(lt);sync='err';setSync()});
  DB.doc('holding/main').onSnapshot(sn=>{
    if(dirty.has('holding/main')||writing.has('holding/main'))return;
    if(!sn.metadata.fromCache||sn.exists){S.h=sn.exists?sanH(sn.data()):{links:[]};if(dbReady)render(true)}
  },()=>{});
  DB.doc('library/main').onSnapshot(sn=>{
    if(dirty.has('library/main')||writing.has('library/main'))return;
    if(!sn.metadata.fromCache||sn.exists){S.lib=sn.exists?sanLib(sn.data()):{items:[]};if(dbReady)render(true)}
  },()=>{});
}
function start(data){
  let ui={};try{ui=JSON.parse(localStorage.getItem(UIKEY)||'{}')||{}}catch(e){}
  let st=data&&Array.isArray(data.vs)?data:null;
  if(!st){try{const r=localStorage.getItem(KEY);if(r)st=JSON.parse(r)}catch(e){}}
  const base=sample();
  S=st&&Array.isArray(st.vs)&&st.vs.length?{vs:st.vs.map(v=>sanitize(v,v&&v.id)).filter(Boolean),cur:st.cur,lang:base.lang}:base;
  if(!S.vs.length)S=base;
  S.h=sanH((st&&st.h)||(S===base?base.h:null));
  S.lib=sanLib(st&&st.lib);
  S.as=ui.as&&typeof ui.as==='object'?Object.fromEntries(Object.entries(ui.as).map(([k,x])=>[sid(k),sid(x)])):{};
  S.lang=ui.lang==='en'||ui.lang==='tr'?ui.lang:(st&&st.lang)||S.lang;
  if(ui.cur&&S.vs.some(v=>v.id===ui.cur))S.cur=ui.cur;
  window.claude?.hot?.snapshot?.(()=>S);
  renderAll();
  connect();
}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
}
